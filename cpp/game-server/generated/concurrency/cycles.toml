# Hand-owned cycle resolutions for cpp/tools/gen/fieldmap.py (design runtime-architecture.md §5.3, lint L16).
#
# Every `field` and `capture` edge listed in cycles_report.md needs one entry:
#   "Class.field" / "Class$1#capture" / "Outer@L123:45#capture" = "part" | "java-hook: <method>" | "cpp-breaker: <method>"
#                                                                | "zombie-safe: <edge>" | "accepted: <why>"
# cycles_report.md prints a skeleton with suggestions for every unresolved edge.
#
# How the kinds are used (S0b cycle review, 2026-09-14)
# - java-hook:   Java code removes exactly this reference at a lifecycle point (despawn, effect end, leave team, ...). The port keeps it.
# - cpp-breaker: C++-only code removes exactly this reference (Java relies on the garbage collector). Every breaker is named; the C++
#                additions are listed in DEVIATIONS when their chunk ports them.
# - zombie-safe: the reference is removed by LogoutBreakers (logout / delete, model/gameobjects/player/LogoutBreakers.h) or by a Java hook,
#                and the zombie breaker (runtime LeakCensus, design §5.3) may also cut it: breakKnownEdges() on an object removed from the
#                world for gameserver.runtime.zombie_break_minutes cuts only the zombie-safe edges. The list is
#                LogoutBreakers::ZOMBIE_SAFE_EDGES; test_fieldmap_real checks it against this file.
# - accepted:    the reference itself is never removed. The reason starts with one of
#                  "cut elsewhere: <edges>"  every cycle through it passes one of the named java-hook/cpp-breaker/zombie-safe edges;
#                  "no instance cycle: <why>" the cycle exists only between types (subtype expansion), never between objects;
#                  "server lifetime: <why>"  the objects on the cycle are reachable from a root until shutdown;
#                  "one-shot task: <why>"    a scheduled task that releases its captures when it runs or is cancelled.
# - part:        the field is a part (or its owner or sibling reference) whose fieldmap.toml override waits for a hub header change; once the
#                override is applied the edge leaves the report and the key is deleted. Other parts are fieldmap.toml [fields] overrides.
#
# LogoutBreakers (declared in model/gameobjects/player/LogoutBreakers.h; noexcept, idempotent, no notifications, no packets, no DAO):
#   run(Player&), in this order (L1-L7): VisibleObject.target, Player.kisk, PlayerStorage.actor (inventory, regular warehouse, account
#     warehouse), PlayerController.stanceObserver, Player.rideObservers, IdianStone.actionListener (equipped items),
#     ObserveController.observers + attackCalcObservers. Created as a finally guard at the top of PlayerLeaveWorldService.leaveWorld and in
#     the catch path of enter-world after PlayerService.getPlayer.
#   onDelete(VisibleObject&), called last by VisibleObjectController::onDelete (reached through super from every controller), in this
#     order (D1-D6): VisibleObject.target; Creature: ObserveController observers, EffectController maps, CreatureGameStats functions owned
#     by effects; Npc: Npc.walkerGroup; Player: run(player).
#   breakZombieEdges(VisibleObject&): the zombie-safe edges of the object's kind, returning the names of the edges it cut.
# Instance destroy (InstanceService.destroyInstance, C++ additions): WorldMapInstance::detachInstanceHandler, setStartPos(nullptr),
#   releaseRegisteredTeam.
#
# Edges of the handler scripts (game-server/data/handlers) are resolved by their phase-6 chunks
# (handlers-and-porting-plan.md amendments §12); lint --cycles is enabled in CTest once they are.

