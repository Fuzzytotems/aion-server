"com.aionemu.gameserver.skillengine.task.GatheringTask.gathererObserver" = "cpp-breaker: GatheringTask::onInteractionFinish removes the observer from the gatherer's ObserveController and clears the Field (GatheringTask.cpp:92-100); Java's field is final and the observer captures the task, so the two would keep each other alive. That reset is the only cut, and every end of a gathering reaches it: stop() calls onInteractionFinish, and abort() is onInteractionAbort (packets only) plus stop() - the observer's own events, AbstractInteractionTask.start of a new interaction, GatherableController::cancelGathering at despawn and leaveWorld at logout (PlayerLeaveWorldService.java:125-126) all abort. A periodic body that throws never returns to stop() (m5a-plan.md §10.5), so the cycle then waits for one of those aborts."
