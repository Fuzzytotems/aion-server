# Hand-owned overrides for cpp/tools/gen/fieldmap.py (design runtime-architecture.md §3.2.2). Every entry needs a reason.
#
# [settings]              packet_bases / connection_bases (FQNs), per_run_services (FQNs that must stay RefCounted, lint L13)
# [future_apis]           "Receiver.method" or "method" = { receiver = "regex"?, reason }: calls whose Runnable argument is stored by
#                         the scheduler; the storage owner of the callback is the class that keeps the returned Future
# [stored_callback_apis]  "Receiver.method" = { owner = "FQN" | ["FQN", ...], receiver = "regex"?, handle = true?, reason }: storing APIs that
#                         the parameter-store inference cannot see (external storage). Project methods that assign a parameter to a field
#                         or add/put it into a field collection are found automatically. handle = true: the call returns a handle that
#                         keeps the callback (a JobDetail), so the class keeping the returned value is an owner too, like a Future holder
# [kinds."FQN"]           kind = "K1".."K5", reason
# [immortal]              "FQN" = { reason }: interned classes whose instances live until shutdown (base Immortal, referenced as const X*)
# [bases]                 "FQN" = { base = "none" | "RefCounted" | "Immortal", reason }: the runtime base of the C++ class when the inferred one
#                         differs; "none" lets each subclass pick its own base (an abstract Java base of RefCounted and part subclasses)
# [fields."FQN.field"]    cpp = "C++ member type", part = true?, part_type = "FQN"?, retire = "OWNER" | "RECLAIMER"?, retains = ["FQN", ...]?, reason;
#                         or drop = true, reason (the port has no such member). retains adds cycle-graph targets the Java type does not name
#                         (WeakReference<X>) or that the model sees as static data although run-time subclasses exist. An OwnerRef<>
#                         spelling in a class that is no part also takes holders = ["FQN.field", ...] and accessor = "name": lint L3 then
#                         rejects members and stored-lambda captures naming the class outside those holders, and reads of the member
#                         outside its constructors and the checked accessor
# [captures."ClassId#capture"]  cpp = "C++ member type", reason: spelling of a captured variable (this$0, val$x) of an anonymous, local or
#                         inner class or a lambda (ids as in fieldmap.json); X*, OwnerRef<X> and weak_ptr<X> make the capture non-retaining;
#                         or drop = true, reason (the port has no such member: it copies the values it reads; non-retaining)
# [cpp_members."FQN.member"]  cpp = "C++ member type", part_type = "FQN"? | retains = ["FQN", ...]?, reason: a member the C++ class has and
#                         the Java class has not. Lint L2 compares the spelling and rejects C++-only retaining members missing here; part_type
#                         adds a part edge and retains field edges to the cycle graph (needing cycles.toml entries like Java fields)
#
# Applied by fieldmap.py itself, so no override is needed (S0c infra): the erasure rule (hub-headers.md §8.1: OwnerRef<Creature> for
# AbstractAI.owner, Ref<TeamMember> for GeneralTeam), Timestamp/Date/Instant -> Timestamp, JobDetail -> Ref<JobDetail>, CronExpression and
# the other hub-headers.md §6 external spellings (EXTERNAL_SPELLING), `static const X* const` for named constants of the own type.

[settings]
packet_bases = ["com.aionemu.commons.network.packet.BasePacket"]
connection_bases = ["com.aionemu.commons.network.AConnection"]
# not singletons even when Java uses the SingletonHolder pattern (conventions-game-server.md: RefCounted and pinned, lint L13)
per_run_services = ["com.aionemu.gameserver.services.panesterra.ahserion.AhserionRaid"]
# classes ported as C++ value types (copied, stored by value inside Field<T>; P4-03 geomath): scalar-like in the field table, never escape
value_types = [
	"com.aionemu.gameserver.geoEngine.math.Vector2f",
	"com.aionemu.gameserver.geoEngine.math.Vector3f",
	"com.aionemu.gameserver.geoEngine.math.Matrix3f",
	"com.aionemu.gameserver.geoEngine.math.Matrix4f",
	"com.aionemu.gameserver.geoEngine.math.Ray",
]

[future_apis]
"ThreadPoolManager.schedule" = { reason = "ScheduledPool task (design §7.1)" }
"ThreadPoolManager.scheduleAtFixedRate" = { reason = "ScheduledPool periodic task" }
"ThreadPoolManager.execute" = { reason = "InstantPool task" }
"ThreadPoolManager.executeLongRunning" = { reason = "LongRunning pool task" }
"ThreadPoolManager.submit" = { reason = "InstantPool task with Future" }
"ThreadPoolManager.submitLongRunning" = { reason = "LongRunning pool task with Future" }

[stored_callback_apis]
"CronService.schedule" = { owner = "com.aionemu.gameserver.services.cron.CronService", handle = true, reason = "Quartz job store (external); CronService is an immortal root. The returned JobDetail keeps the job's callback (CronService.h), so a class keeping the JobDetail (QuestEngine.messageTask, EventService.checkTask, AtreianPassportService.cronInfo) retains the callback and its captures: handle = true" }

[kinds]
"com.aionemu.gameserver.network.Crypt" = { kind = "K5", reason = "crypt state is IO-strand only (design §8.6); P4-15a keeps plain members" }
"com.aionemu.gameserver.network.EncryptionKeyPair" = { kind = "K5", reason = "owned by Crypt, IO-strand only (design §8.6)" }
"com.aionemu.gameserver.model.team.common.events.PlayerLeavedEvent" = { kind = "K5", reason = "team events live on the stack like the other TeamEvents (design §14.2d); the INSTANCE_KICK task of handleEvent captures leavedPlayer and team as Refs, not this" }
"com.aionemu.gameserver.model.team.group.events.PlayerGroupLeavedEvent" = { kind = "K5", reason = "subclass of PlayerLeavedEvent (K5 override)" }
"com.aionemu.gameserver.model.team.alliance.events.PlayerAllianceLeavedEvent" = { kind = "K5", reason = "subclass of PlayerLeavedEvent (K5 override)" }
"com.aionemu.gameserver.controllers.PetController.PetUpdateTask" = { kind = "K4", reason = "the Runnable PetSpawnService schedules at a fixed rate; it keeps startTime between runs and reads its player on the pool thread, so it is RefCounted and retains the player (the escape inference misses it: nobody keeps the task object itself); matches PetController.h" }
"com.aionemu.gameserver.controllers.CreatureController.DelayedOnAttack" = { kind = "K4", reason = "a Runnable scheduled by attackTarget (ThreadPoolManager.schedule, CreatureController.java:359) that runs on another thread after attackTarget returned; the escape inference misses it because nobody keeps the Future. run() clears its references" }
"com.aionemu.gameserver.services.LifeStatsRestoreService.HpRestoreTask" = { kind = "K4", reason = "the Runnable scheduleHpRestoreTask schedules at a fixed rate (LifeStatsRestoreService.java:28); it reads its lifeStats on the pool thread in later runs and run() clears it, so it is RefCounted and retains the lifeStats (the task-object inference also finds it and follows the returned Future to the lifeStats field the caller assigns, freeze review); matches LifeStatsRestoreService.cpp" }
"com.aionemu.gameserver.services.LifeStatsRestoreService.HpMpRestoreTask" = { kind = "K4", reason = "the Runnable scheduleRestoreTask schedules at a fixed rate (LifeStatsRestoreService.java:24); it reads its lifeStats on the pool thread in later runs and run() clears it, so it is RefCounted and retains the lifeStats (the task-object inference also finds it and follows the returned Future to the lifeStats field the caller assigns, freeze review); matches LifeStatsRestoreService.cpp" }
"com.aionemu.gameserver.services.LifeStatsRestoreService.FpReduceTask" = { kind = "K4", reason = "the Runnable scheduleFpReduceTask schedules at a fixed rate (LifeStatsRestoreService.java:32); it keeps secondsElapsed between runs, reads its lifeStats on the pool thread and run() clears it, so it is RefCounted and retains the lifeStats (the task-object inference also finds it and follows the returned Future to the lifeStats field the caller assigns, freeze review); matches LifeStatsRestoreService.cpp" }
"com.aionemu.gameserver.services.LifeStatsRestoreService.FpRestoreTask" = { kind = "K4", reason = "the Runnable scheduleFpRestoreTask schedules at a fixed rate (LifeStatsRestoreService.java:36); it reads its lifeStats on the pool thread in later runs and run() clears it, so it is RefCounted and retains the lifeStats (the task-object inference also finds it and follows the returned Future to the lifeStats field the caller assigns, freeze review); matches LifeStatsRestoreService.cpp" }
"com.aionemu.gameserver.services.instance.InstanceService.EmptyInstanceCheckerTask" = { kind = "K4", reason = "the Runnable registerAvailableInstance schedules at a fixed rate and stores in WorldMapInstance.emptyInstanceTask (InstanceService.java:58); it reads its instance on the pool thread in every run, so it is RefCounted and retains the instance (the escape inference misses a task object passed to scheduleAtFixedRate); matches InstanceService.cpp" }
"com.aionemu.gameserver.ai.follow.FollowSummonTaskAI" = { kind = "K4", reason = "the Runnable FollowStartService.newFollowingToTargetCheckTask schedules at a fixed rate (FollowStartService.java:23); it reads target, summon and master on the pool thread in every run, so it is RefCounted and retains them (the escape inference misses a task object passed to scheduleAtFixedRate)" }
"com.aionemu.gameserver.ai.handler.AggroEventHandler.AggroNotifier" = { kind = "K4", reason = "the Runnable AggroEventHandler schedules 500 ms later (AggroEventHandler.java:23,32,45); it reads aggressive and target on the pool thread and run() clears them, so it is RefCounted and retains them (the escape inference misses a task object passed to schedule)" }
"com.aionemu.gameserver.ai.manager.SimpleAttackManager.SimpleCheckedAttackAction" = { kind = "K4", reason = "the Runnable SimpleAttackManager.addAttackEvent schedules (SimpleAttackManager.java:47); it reads npcAI on the pool thread and run() clears it, so it is RefCounted and retains the AI part (the escape inference misses a task object passed to schedule)" }
"com.aionemu.gameserver.controllers.observer.AbstractMaterialSkillActor.MaterialSkillTask" = { kind = "K4", reason = "the inner Runnable act() schedules at a fixed rate and keeps in the task AtomicReference (AbstractMaterialSkillActor.java:41); it keeps skill and secondsElapsed between runs, so it is RefCounted (the escape inference misses a task object passed to scheduleAtFixedRate)" }
"com.aionemu.gameserver.model.instance.InstanceBuff.InstanceBuffTask" = { kind = "K4", reason = "the inner Runnable applyEffect schedules and keeps in InstanceBuff.task (InstanceBuff.java:48); it reads its player on the pool thread, so it is RefCounted and retains the player (the escape inference misses a task object passed to schedule)" }
"com.aionemu.gameserver.questEngine.task.FollowingNpcCheckTask" = { kind = "K4", reason = "the Runnable QuestTasks schedules at a fixed rate and keeps as the player's QUEST_FOLLOW task (QuestTasks.java:29-65); it reads env and destinationChecker on the pool thread in every run, so it is RefCounted and retains them (the escape inference misses a task object passed to scheduleAtFixedRate)" }
"com.aionemu.gameserver.services.NpcShoutsService.NpcShoutTask" = { kind = "K4", reason = "the inner Runnable registerShoutTask schedules at a fixed rate and keeps as the Npc's SHOUT task (NpcShoutsService.java:47); it reads npc and shouts on the pool thread in every run, so it is RefCounted and retains them (the escape inference misses a task object passed to scheduleAtFixedRate); matches NpcShoutsService.cpp" }
"com.aionemu.gameserver.services.summons.SummonsService.ReleaseSummonTask" = { kind = "K4", reason = "a Runnable that schedules itself (ThreadPoolManager.schedule(this, ...), SummonsService.java:95) and keeps addedMasterHate for its run, so it is RefCounted and retains summon and release (the escape inference misses a `this` task argument); matches SummonsService.cpp" }
"com.aionemu.gameserver.services.teleport.TeleportService.SpawnTask" = { kind = "K4", reason = "the Runnable teleportTo wraps in a FutureTask kept as the player's TELEPORT task and CM_TELEPORT_ANIMATION_DONE runs on a later packet (TeleportService.java:184-191), so it is RefCounted and retains the player (the escape inference misses a task object held by a local); matches TeleportService.cpp" }
"com.aionemu.gameserver.skillengine.effect.AuraEffect.AuraTask" = { kind = "K4", reason = "the inner Runnable startEffect schedules at a fixed rate and keeps as a periodic task of the effect (AuraEffect.java:76); it reads its effect on the pool thread in every run, so it is RefCounted and retains the effect (the escape inference misses a task object passed to scheduleAtFixedRate)" }
"com.aionemu.gameserver.services.CronJobService.IdianDepthPortalSpawner" = { kind = "K4", reason = "a Runnable that reschedules itself (ThreadPoolManager.schedule(this, ...), CronJobService.java:98) and keeps the two spawned portal Npcs between runs, so it is RefCounted and retains them (the escape inference misses a `this` task argument); matches CronJobService.cpp" }
"com.aionemu.gameserver.network.aion.AionClientPacketFactory.PacketInfo" = { kind = "K5", reason = "an entry of the opcode table, held by value: written by the static initializer (setEntries: startup and tests) before the table is published and only read afterwards (IO threads); never stored in a shared member (header request network-6); matches AionClientPacketFactory.h" }
"com.aionemu.gameserver.network.loginserver.LsClientPacketFactory.PacketInfo" = { kind = "K5", reason = "an entry of the constant packet table in LsClientPacketFactory.cpp, held by value and only read; never stored in a shared member (header request network-6); matches LsClientPacketFactory.h" }
"com.aionemu.gameserver.network.chatserver.CsClientPacketFactory.PacketInfo" = { kind = "K5", reason = "an entry of the constant packet table in CsClientPacketFactory.cpp, held by value and only read; never stored in a shared member (header request network-6); matches CsClientPacketFactory.h" }
"com.aionemu.gameserver.geoEngine.utils.TempVars" = { kind = "K5", reason = "thread-local scratch pool (Java ThreadLocal<TempVarsStack>, runtime-architecture.md §3.2 ThreadLocal<T> -> thread_local T): the per-thread stack is the only holder and an instance is used only between get() and release() on that thread, which the escape analysis does not treat as confinement (header request geo-3); matches TempVars.h" }
"com.aionemu.gameserver.geoEngine.utils.TempVars.TempVarsStack" = { kind = "K5", reason = "the thread_local stack of TempVars itself, never shared (header request geo-3); matches TempVars.h" }
"com.aionemu.gameserver.geoEngine.collision.bih.BIHNode.BIHStackData" = { kind = "K5", reason = "an entry of the thread-local BIH traversal stack TempVars.bihStack, held by value for one ray query: a RefCounted object per push would put every ray query on the Reclaimer (header request geo-3); matches BIHNode.h" }


